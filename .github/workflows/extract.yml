name: Crucible claim extraction

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crucible-claim-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out worker controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Check out configured Crucible learning branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jonathanblunt1214-lgtm/The-Crucible
          ref: ${{ vars.CRUCIBLE_REF || 'development' }}
          path: crucible-engine
          persist-credentials: false

      - name: Run deterministic encrypted hosted extraction
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          LEARNING_WORKER_KEY: ${{ secrets.LEARNING_WORKER_KEY }}
        run: .\scripts\run-hosted-extraction.ps1
