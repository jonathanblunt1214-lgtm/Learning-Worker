name: Crucible oversight-vetted intake

on:
  repository_dispatch:
    types: [oversight_vetting_result]

permissions:
  contents: write

concurrency:
  group: crucible-claim-extraction
  cancel-in-progress: false

jobs:
  intake:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify signed oversight bundle and update encrypted approval state
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          LEARNING_WORKER_KEY: ${{ secrets.LEARNING_WORKER_KEY }}
          OVERSIGHT_SIGNING_PUBLIC_KEY: ${{ vars.OVERSIGHT_SIGNING_PUBLIC_KEY }}
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'jonathanblunt1214-lgtm/Learning-Worker') { throw 'Unexpected repository identity.' }
          if (-not $env:OVERSIGHT_SIGNING_PUBLIC_KEY) { throw 'Oversight signing public key is unavailable.' }
          $root = $env:RUNNER_TEMP
          $encrypted = Join-Path $root 'state.zip.enc'
          $archive = Join-Path $root 'state.zip'
          $state = Join-Path $root 'learning'
          $key = Join-Path $root 'oversight-public.pem'
          gh release download worker-state --repo $env:GITHUB_REPOSITORY --pattern 'state.zip.enc' --dir $root --clobber
          node scripts/crypt-bundle.js decrypt $encrypted $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $state
          [IO.File]::WriteAllText($key, $env:OVERSIGHT_SIGNING_PUBLIC_KEY)
          node scripts/verify-oversight-bundle.js $env:GITHUB_EVENT_PATH $key (Join-Path $state 'oversight-approvals.json')
          Remove-Item -LiteralPath $key -Force
          Compress-Archive -Path (Join-Path $state '*') -DestinationPath $archive -CompressionLevel Optimal -Force
          Remove-Item -LiteralPath $encrypted -Force
          node scripts/crypt-bundle.js encrypt $archive $encrypted
          gh release upload worker-state $encrypted --repo $env:GITHUB_REPOSITORY --clobber
